name: Gap CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gap-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --include=dev
      - run: npm run ci
      - name: Check the split frontend and relay deployment
        run: npm run verify:local
      - name: Verify the Netlify build guard
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { validateRelayUrl } from './scripts/validate-netlify.mjs';
          assert.throws(() => validateRelayUrl(''));
          assert.equal(validateRelayUrl('https://gap-relay.onrender.com'), 'https://gap-relay.onrender.com');
          JS
